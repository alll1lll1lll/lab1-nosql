spring:
  application:
    name: university-booking

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis

server:
  port: 8080

logging:
  level:
    com.university.booking: DEBUG
    org.springframework.data.redis: DEBUG
  structured:
    format:
      console: logstash

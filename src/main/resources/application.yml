spring:
  application:
    name: university-booking

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis

server:
  port: 8080
  error:
    include-message: always

app:
  cart:
    ttl-seconds: 900
  rate-limit:
    requests-per-minute: 60

logging:
  level:
    com.university.booking: DEBUG
    org.springframework.data.redis: DEBUG
  structured:
    format:
      console: logstash
